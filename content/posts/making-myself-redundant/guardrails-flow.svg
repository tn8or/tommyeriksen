<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07a2f"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d8f"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#faf8f4"/>
  <text x="80" y="95" font-size="44" font-weight="700" fill="#1f3a5f">Agent guardrails</text>
  <text x="80" y="140" font-size="24" fill="#5b6b7f">Agents do the work. A human decides what goes live.</text>

  <!-- Agent zone -->
  <rect x="60" y="200" width="960" height="430" rx="24" fill="#eef4f8" stroke="#c9d8e4" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="90" y="240" font-size="20" font-weight="600" fill="#5b6b7f" letter-spacing="2">AGENT ZONE · NO MERGE · NO PROD WRITE</text>

  <!-- Task -->
  <rect x="100" y="330" width="200" height="120" rx="18" fill="#ffffff" stroke="#1f3a5f" stroke-width="3"/>
  <text x="200" y="382" font-size="26" font-weight="700" fill="#1f3a5f" text-anchor="middle">Goal</text>
  <text x="200" y="415" font-size="18" fill="#5b6b7f" text-anchor="middle">not just the task</text>

  <!-- Code agent -->
  <rect x="380" y="330" width="220" height="120" rx="18" fill="#1f3a5f"/>
  <text x="490" y="382" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Code agent</text>
  <text x="490" y="415" font-size="18" fill="#c9d8e4" text-anchor="middle">writes + tests IaC</text>

  <!-- Review agent -->
  <rect x="690" y="330" width="240" height="120" rx="18" fill="#2a9d8f"/>
  <text x="810" y="382" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Review agent</text>
  <text x="810" y="415" font-size="18" fill="#e6f5f3" text-anchor="middle">errors + regressions</text>

  <path d="M300 390 L372 390" stroke="#1f3a5f" stroke-width="4" marker-end="url(#a)"/>
  <path d="M600 375 L682 375" stroke="#1f3a5f" stroke-width="4" marker-end="url(#a)"/>
  <!-- send back loop -->
  <path d="M810 450 C 810 540, 490 540, 490 458" fill="none" stroke="#e07a2f" stroke-width="4" marker-end="url(#o)"/>
  <text x="650" y="560" font-size="20" fill="#e07a2f" text-anchor="middle" font-weight="600">"Technically solved, but X can break." Back you go.</text>

  <!-- Read-only observability -->
  <rect x="380" y="250" width="550" height="46" rx="12" fill="#ffffff" stroke="#2a9d8f" stroke-width="2"/>
  <text x="655" y="281" font-size="19" fill="#2a9d8f" text-anchor="middle" font-weight="600">Read-only observability: eyes, not hands</text>

  <!-- Human gate -->
  <path d="M930 390 L1082 390" stroke="#1f3a5f" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1090" y="300" width="230" height="180" rx="18" fill="#ffffff" stroke="#e07a2f" stroke-width="4"/>
  <text x="1205" y="360" font-size="26" font-weight="700" fill="#1f3a5f" text-anchor="middle">Human gate</text>
  <text x="1205" y="395" font-size="18" fill="#5b6b7f" text-anchor="middle">Is this the direction</text>
  <text x="1205" y="420" font-size="18" fill="#5b6b7f" text-anchor="middle">I had in mind?</text>
  <text x="1205" y="455" font-size="18" fill="#e07a2f" text-anchor="middle" font-weight="600">Merge = human only</text>

  <!-- Production -->
  <path d="M1320 390 L1392 390" stroke="#1f3a5f" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1400" y="330" width="150" height="120" rx="18" fill="#1f3a5f"/>
  <text x="1475" y="385" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Goes</text>
  <text x="1475" y="415" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">on air</text>

  <!-- Learning loop -->
  <rect x="380" y="690" width="760" height="110" rx="18" fill="#ffffff" stroke="#2a9d8f" stroke-width="3"/>
  <text x="760" y="735" font-size="24" font-weight="700" fill="#2a9d8f" text-anchor="middle">Shared knowledge base</text>
  <text x="760" y="770" font-size="18" fill="#5b6b7f" text-anchor="middle">Lessons and hidden regressions, saved only with approval. Don't poison the future.</text>
  <path d="M1475 450 C 1475 745, 1300 745, 1148 745" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#t)"/>
  <path d="M380 745 C 200 745, 200 470, 200 458" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#t)"/>
  <text x="1490" y="620" font-size="18" fill="#2a9d8f" font-weight="600">learn</text>
  <text x="130" y="620" font-size="18" fill="#2a9d8f" font-weight="600">next session</text>

  <text x="1540" y="870" font-size="16" fill="#9aa7b5" text-anchor="end">tommyeriksen.dk</text>
</svg>
