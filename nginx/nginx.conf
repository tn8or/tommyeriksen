user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Serve Markdown inline as UTF-8 text instead of as a download.
    types {
        text/markdown  md;
    }
    charset        utf-8;
    charset_types  text/xml text/plain text/vnd.wap.wml
                   application/javascript application/rss+xml text/markdown;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"remote_addr":"$remote_addr",'
            '"host":"$host",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log  /dev/stdout json_combined;

    sendfile        on;
    keepalive_timeout  65;

    # Markdown for agents: a client that asks for text/markdown (and doesn't
    # rule it out with q=0) gets the page's index.md instead of index.html.
    map $http_accept $wants_markdown {
        default                                              0;
        "~*text/markdown(?!\s*;\s*q\s*=\s*0(\.0*)?\s*(,|$))"  1;
    }

    # Cloudflare ignores Vary: Accept, so a cached page would be served to
    # everyone in whichever form was fetched first. Keep pages (HTML and
    # Markdown) out of shared caches; assets stay cacheable.
    map $sent_http_content_type $page_cache_control {
        default            "";
        "~^text/html"      "private, no-cache";
        "~^text/markdown"  "private, no-cache";
    }

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # The same URL has an HTML and a Markdown representation.
        add_header Vary Accept always;
        add_header Cache-Control $page_cache_control always;

        location / {
            error_page 418 = @markdown;
            if ($wants_markdown) {
                return 418;
            }
            try_files $uri $uri/ =404;
        }

        # Falls back to the HTML (or the asset itself) when a URL has no
        # Markdown version.
        location @markdown {
            try_files $uri/index.md $uri $uri/index.html =404;
        }

        location = /_nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}
