{{- $commit := partial "build-commit.html" . | strings.TrimSpace -}}
{{- with $commit }}
<p class="build-commit">
  Built from <a href="{{ printf "%s/commit/%s" (strings.TrimSuffix "/" site.Params.repository) . }}">{{ substr . 0 7 }}</a>
</p>
{{- end }}
{{- /* Metricool tracking pixel (WEBS-7). Hidden by the site stylesheet. */ -}}
<img class="metricool-pixel" src="https://tracker.metricool.com/c3po.jpg?hash=4a1a4afb32a8e72b3c86a516351b4937" alt="" width="1" height="1" aria-hidden="true" />
