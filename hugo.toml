baseURL = "https://tommyeriksen.dk"
title = "tommyeriksen.dk"
theme = "hugo-theme-stack"
enableRobotsTXT = true
# Posts go live on their `date`: future-dated posts are left out until a build
# on or after that date (the scheduled morning build in ci.yml). A bare
# date = 'YYYY-MM-DD' is midnight in this time zone.
buildFuture = false
timeZone = 'Europe/Copenhagen'

[pagination]
  pagerSize = 8

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    identifier = "start-here"
    name = "Start here"
    url = "/start-here/"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 4
  [[menu.main]]
    identifier = "cv"
    name = "CV"
    url = "/about/cv/"
    weight = 5

[params]
  # Fallback og:image/twitter:image for pages without a bundle image
  # (layouts/partials/_funcs/get-page-images.html).
  images = ["avatar.png"]
  author = "Tommy Eriksen"
  description = "Geek at heart"
  # Source repository. The footer links the build commit here.
  repository = "https://github.com/tn8or/tommyeriksen"
  mainSections = ["posts"]
  [params.sidebar]
    avatar = "/avatar.png"
    subtitle = "Geek at heart"
  [params.footer]
    since = 2026
  [params.colorScheme]
    toggle = true
    default = "dark"
  [params.article]
    toc = false
    readingTime = true
    [params.article.list]
      showTags = true

# Stack reads social links from menu entries.
[[menu.social]]
  name = "GitHub"
  url = "https://github.com/tn8or"
  weight = 1
  [menu.social.params]
    icon = "brand-github"
    newTab = true
[[menu.social]]
  name = "Bluesky"
  url = "https://bsky.app/profile/tommyeriksen.dk"
  weight = 2
  [menu.social.params]
    icon = "brand-bluesky"
    newTab = true
[[menu.social]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/toeriksen/"
  weight = 3
  [menu.social.params]
    icon = "brand-linkedin"
    newTab = true
[[menu.social]]
  name = "Facebook"
  url = "https://www.facebook.com/tommy.eriksen"
  weight = 4
  [menu.social.params]
    icon = "brand-facebook"
    newTab = true
[[menu.social]]
  name = "Instagram"
  url = "https://www.instagram.com/tn8or"
  weight = 5
  [menu.social.params]
    icon = "brand-instagram"
    newTab = true
[[menu.social]]
  name = "Threads"
  url = "https://www.threads.net/@tn8or"
  weight = 6
  [menu.social.params]
    icon = "brand-threads"
    newTab = true
[[menu.social]]
  name = "YouTube"
  url = "https://www.youtube.com/@EriksenAevler"
  weight = 7
  [menu.social.params]
    icon = "brand-youtube"
    newTab = true

# Markdown copy of every page (index.md next to index.html). nginx serves it
# instead of the HTML when a client sends Accept: text/markdown.
[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["html", "rss", "markdown"]
  section = ["html", "rss", "markdown"]
  page = ["html", "markdown"]

# Don't publish raw page-bundle files (multi-MB originals with EXIF). Only
# what a template uses gets published: resized images, the 3000px full-size
# copy (render-image.html), og:image, SVG.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = '/posts/**'
