name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: tommyeriksen
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Build Hugo site (test)
        run: hugo --minify
        env:
          HUGO_PARAMS_commit: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # main pushes :latest (production); PRs from this repo push :staging.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tommyeriksen:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -eu
          name="smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run -d --name "$name" tommyeriksen:ci
          trap 'docker logs "$name" || true; docker rm -f "$name" >/dev/null' EXIT
          for i in $(seq 1 20); do
            docker exec "$name" curl -fsS -o /dev/null http://127.0.0.1/ && break
            sleep 1
          done
          echo "GET / ..."
          docker exec "$name" curl -fsS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1/
          echo "GET missing page returns 404 ..."
          code=$(docker exec "$name" curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/ci-smoke-missing)
          test "$code" = 404
          echo "GET .md is served inline as UTF-8 markdown ..."
          docker exec "$name" sh -c 'printf "# smoke \342\200\223 test\n" > /usr/share/nginx/html/ci-smoke.md'
          ctype=$(docker exec "$name" curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1/ci-smoke.md)
          echo "$ctype"
          test "$ctype" = "text/markdown; charset=utf-8"

      # Same inputs as above, so this reuses the cached build.
      - name: Push container image
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tn8or/tommyeriksen:${{ github.event_name == 'push' && 'latest' || 'staging' }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
